# ===============
# Project Context
# ===============
project:
  domain: "Satellite Imagery & Disaster Response"
  context_statement: "assessing building damage from post-hurricane aerial photography"
  use_case: "educational_curriculum"

# ================
# Dataset Settings
# ================
dataset:
  root_path: "hurricane_dataset"
  structure: "folder_per_class"

  train_split: 0.8
  validation_split: 0.2
  ignore_list: [.DS_Store]
  save_class_mapping: true

output:
  directory: "./outputs/hurricane_v1"
  save_plots: true
  artifact_path: "./models/artifacts"

# ================
# Pipeline Stages
# ================
pipeline:
  stages:
    - name: "Classification"
      active: true
      task_type: "satellite_classification"
      module: "curriculum_resources.week_08.solution"
      model_path: "models/dinov2_vitb14_hurricane_best.pt"

    - name: "Segmentation"
      active: true
      task_type: "object_extraction"
      module: "curriculum_resources.week_09.solution"
      model_path: "models/sam_vit_b.pth"
      prompt: "the building or structure in the image"

    - name: "VisionQA"
      active: true
      task_type: "visual_question_answering"
      module: "curriculum_resources.week_11.solution"
      prompt: "Analyze the segmented building. Assess the structural integrity and respond with only one word: Intact or Destroyed."
      target_metric: "structural_assessment"

# ============
# Execution
#=============
execution:
  environment: "local"
  device: "cuda"
  batch_size: 32
  image_size: 518
  max_samples: 100

# ==================
# Curriculum Config
# ==================
curriculum:
  subject: "Applied AI in Disaster Response"
  grade: 11
  weeks: 12

  topics:
    - name: "Satellite Damage Assessment"
      description: "Learn to build a vision model that can assess post-hurricane building damage."
      project: "Hurricane Damage Assessor"

  resources:
    - name: "Hurricane Dataset Source"
      url: "https://www.kaggle.com/datasets/kmader/satellite-images-of-hurricane-damage"
    - name: "DINOv2 Documentation"
      url: "https://huggingface.co/docs/transformers/en/model_doc/dinov2"
