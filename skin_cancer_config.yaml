# ===============
# Project Context
# ===============
project:
  domain: "Medical Imaging & Diagnostics"
  context_statement: "diagnosing skin lesions as benign or malignant from dermatoscopic images"
  use_case: "educational curriculum"

# ================
# Dataset Settings
# ================
dataset:
  root_path: "/fs/ess/PAS2699/digitalAgEdu_datasets/skin_cancer_dataset"

output:
  directory: "./outputs/skin_cancer_v1"

# ================
# Pipeline Stages
# ================
pipeline:
  stages:
    - name: "Classification"
      active: true
      task_type: "medical_classification"

    - name: "Segmentation"
      active: true
      task_type: "object_extraction"
      prompt: "the skin lesion or mole, the dark spot on the skin" # Prompt for SAM

    - name: "VisionQA"
      active: false
      task_type: "visual_question_answering"
      prompt:  "Based on the classification provided, analyze the visual characteristics of the image that support this conclusion. Provide a concise 2-sentence explanation of the visual evidence."
      target_metric: "diagnosis_reasoning"

# ============
# Execution
#=============
execution:
  device: "cuda" # cpu or cuda
  batch_size: 16
  image_size: 518
  max_samples: null
  seed: 6767


# ==================
# Curriculum Config
# ==================
curriculum:
  subject: "Intro to Medical AI: Skin Cancer Diagnostics"
  grade: 10
  weeks: 24

  topics:
    - name: "Skin Lesion Classification"
      description: "Learn to build a vision model that can classify skin lesions as benign or malignant."
      project: "Skin Cancer Diagnostic AI"

  resources:
    - name: "Skin Cancer Dataset Source"
      url: "https://www.kaggle.com/datasets/fanconic/skin-cancer-malignant-vs-benign"
    - name: "DINOv2 Documentation"
      url: "https://huggingface.co/docs/transformers/en/model_doc/dinov2"
