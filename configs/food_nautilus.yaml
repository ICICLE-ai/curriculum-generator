# ===============
# Project Context
# ===============
project:
  domain: "Culinary AI & Smart Kitchens"
  context_statement: "classifying appetizers and dishes to automate food log diagnostics"
  use_case: "educational_curriculum"

# ================
# Dataset Settings
# ================
dataset:
  root_path: "/data/food_dataset/Food Classification dataset"

output:
  directory: "/data/outputs/food_v1"

# ================
# Pipeline Stages
# ================
pipeline:
  stages:
    - name: "Classification"
      active: true
      task_type: "food_classification"


    - name: "Segmentation"
      active: true
      task_type: "object_extraction"
      prompt: "the food item on the plate"

    - name: "VisionQA"
      active: false
      task_type: "visual_question_answering"


# ============
# Execution
# ============
execution:
  device: "cuda"
  batch_size: 16
  image_size: 518
  max_samples: null
  seed: 42

# ==================
# Curriculum Config
# ==================
curriculum:
  subject: "Intro to Applied Computer Vision: Food Classification"
  grade: 10
  weeks: 24

  # ==================
# Curriculum Config
# ==================
curriculum:
  subject: "Intro To Classifying Objects Via Food Classifications"
  grade: 10

  modules: 
  # Explicit per-week assignments (multiple modules can share the same week)
    - id: "numpy_basics"
      week: 1
    - id: "pandas_analytics"
      week: 1
    - id: "pytorch_basics"
      week: 2
    - id: "interactive_segmentation"
      week: 3
    - id: "image_datasets"
      week: 4
    - id: "custom_cnn"
      week: 4
    - id: "cnn_optimization"
      week: 4
    - id: "transfer_learning"
      week: 4
    - id: "semantic_segmentation"
      week: 4
    - id: "explainable_ai"
      week: 5
    - id: "vector_embeddings"
      week: 5
    - id: "gradio_deployment"
      week: 6

  topics:
    - name: "Food Image Classification"
      description: "Learn to build a vision model that can classify 35 different types of food appetizers."
      project: "Culinary Image Classifier"

  resources:
    - name: "Food Dataset Source"
      url: "https://www.kaggle.com/datasets/harishkumardatalab/food-image-classification-dataset"
    - name: "DINOv2 Documentation"
      url: "https://huggingface.co/docs/transformers/en/model_doc/dinov2"
