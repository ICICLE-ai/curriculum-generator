# ===============
# Project Context
# ===============
project:
  domain: "Medical Imaging & Diagnostics"
  context_statement: "diagnosing skin lesions as benign or malignant from dermatoscopic images"
  use_case: "educational curriculum"

# ================
# Dataset Settings
# ================
dataset:
  root_path: "/fs/ess/PAS2699/digitalAgEdu_datasets/skin_cancer_dataset"

output:
  directory: "./output/skin_cancer_v1"

# ================
# Pipeline Stages
# ================
pipeline:
  stages:
    - name: "Classification"
      active: true
      task_type: "medical_classification"

    - name: "Segmentation"
      active: true
      task_type: "object_extraction"
      prompt: "the skin lesion or mole, the dark spot on the skin" # Prompt for SAM

    - name: "VisualXAI"
      active: false
      task_type: "visual_explainibility"

# ============
# Execution
#=============
execution:
  device: "cuda" # cpu or cuda
  batch_size: 16
  image_size: 518
  max_samples: null
  seed: 6767

  use_wandb: true
  use_profiler: true
  wandb_project: "skin-cancer-diagnostics"

  # Phase 2 LLM Setup
  use_llm: true
  llm_base_url: "http://localhost:8000/v1"
  llm_model: "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"


# ==================
# Curriculum Config
# ==================
curriculum:
  subject: "Intro to Medical AI: Skin Cancer Diagnostics"
  target_level: "Undergraduate / Grade 10"
  model: "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"

  modules:
    - id: "numpy_basics"
      title: "NumPy Basics & Data Structures"
      week: 1
      context: "Explore dataset directory structure, NumPy array operations, and matrix normalization."
      difficulty: "Beginner"
    - id: "pandas_analytics"
      title: "Pandas Data Analytics & Metrics Visualizations"
      week: 1
      context: "Analyze pipeline metrics, loss curves, and diagnostic distributions."
      difficulty: "Beginner"
    - id: "pytorch_basics"
      title: "PyTorch Basics & MLP Architecture"
      week: 2
      context: "Build a Multi-Layer Perceptron (MLP) classifier with Cross-Entropy Loss."
      difficulty: "Beginner"
    - id: "interactive_segmentation"
      title: "Interactive OpenCV & SAM Segmentation"
      week: 3
      context: "Build an interactive segmentation application and calculate IoU metrics."
      difficulty: "Intermediate"

  topics:
    - name: "Skin Lesion Classification"
      description: "Learn to build a vision model that can classify skin lesions as benign or malignant."
      project: "Skin Cancer Diagnostic AI"

  resources:
    - name: "Skin Cancer Dataset Source"
      url: "https://www.kaggle.com/datasets/fanconic/skin-cancer-malignant-vs-benign"
    - name: "DINOv2 Documentation"
      url: "https://huggingface.co/docs/transformers/en/model_doc/dinov2"
