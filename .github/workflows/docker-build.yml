name: Build and Push Docker Image

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Run script on push or through GitHub Actions run button
on:
  push:
    branches:
      - iteration_three
      - presentation_animations
      - nrp_llm
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false  # apt-removing them took ~2 min; the rm -rf options above free enough space
          docker-images: false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Logs into Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Builds the Dockerfile and pushes it to Docker Hub
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jassehxia/digital-age-edu:latest
          # Layer cache lives next to the image on Docker Hub: shared by every branch and not evicted by
          # GitHub's 10 GB per-repo Actions cache cap (gha cache is branch-scoped, so new branches built cold)
          cache-from: type=registry,ref=jassehxia/digital-age-edu:buildcache
          cache-to: type=registry,ref=jassehxia/digital-age-edu:buildcache,mode=max
