[project]
name = "digitalagedu"
version = "0.1.0"
description = "digital agriculture curriculum generation engine for k-12 grade students"
authors = [
    {name = "Mrunal Hole"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer (>=0.21.1,<0.22.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]
[tool.poetry.scripts]
digitalagedu = "digitalagedu.cli:app"
