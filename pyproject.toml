[project]
name = "digitalagedu"
version = "1.0.0"
description = "digital agriculture curriculum generation engine for k-12 grade students"
authors = [
    {name = "Jason Seh", email = "seh.1@osu.edu"},
    {name = "Hari Subramoni", email = "subramoni.1@osu.edu"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.2",
    "rich>=13.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "gradio>=4.0.0",
    "transformers>=4.42.0",
    "accelerate>=0.30.0",
    "timm>=0.9.0",
    "segment-anything>=1.0",
    "wandb>=0.16.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]
[tool.poetry.scripts]
digitalagedu = "digitalagedu.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
