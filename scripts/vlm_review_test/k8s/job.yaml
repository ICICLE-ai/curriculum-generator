# The slide-review test (run.sh) as an NRP batch Job, with the same settings as the Expanse Tapis job: one
# V100-SXM2-32GB (the GPU production runs on), the same image, vllm<0.19, fp16, Qwen3-VL-8B, 16k context.
# Only where it runs changes: caches and results live on the CephFS volume instead of Lustre.
apiVersion: batch/v1
kind: Job
metadata:
  name: scd-vlm-review-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - Tesla-V100-SXM2-32GB
      containers:
        - name: vlm-test
          image: jassehxia/digital-age-edu:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              export VLM_OUT="/data/results/$(date +%Y%m%d-%H%M%S)"
              bash /app/scripts/vlm_review_test/run.sh
          env:
            - name: VLM_CACHE
              value: /data/cache
            - name: VLM_SHOTS_FLAT
              value: /data/shots
          # 2 CPUs / 24 GB: vLLM serves from the GPU; 4 / 32 GB left the job Pending on V100 nodes short of CPU or RAM
          resources:
            requests:
              cpu: "2"
              memory: "24Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "24Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scd-vlm-test-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
